name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check (strict) + Biome lint & format
        run: npm run lint

      - name: Unit and API tests (offline)
        run: npm test

      - name: 15-persona safety & grounding evaluation (deterministic engine)
        run: npm run eval

      - name: Production build
        run: npm run build
